services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"

  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongo:27017
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./sessions:/app/sessions

volumes:
  mongo_data:
