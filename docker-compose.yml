services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://mongo:27017
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./sessions:/app/sessions
      - rag_models:/app/data/models

volumes:
  mongo_data:
  rag_models:
